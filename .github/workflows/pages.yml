# Runs the unit tests on every push, then mirrors the branch to gh-pages,
# which GitHub Pages serves at https://ryoga010203.github.io/RYOGA/
name: Test and publish

on:
  push:
    branches: [claude/guitartuna-like-app-2i0x4w, main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: node --test test/pitch.test.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
